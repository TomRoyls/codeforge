name: ✨ Feature Request
description: Suggest a new feature or enhancement for CodeForge
title: '[Feature]: '
labels: ['enhancement', 'needs-triage']
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please fill out this form as completely as possible.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe it
      placeholder: 'I would like to be able to... but currently CodeForge does not support this...'
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you would like to see
      placeholder: 'CodeForge could add a new flag --example that would...'
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: 'I tried using... but it did not work because...'

  - type: dropdown
    id: type
    attributes:
      label: Feature Type
      description: What type of feature is this?
      options:
        - New Rule
        - New Command
        - Command Flag/Option
        - Performance Improvement
        - User Experience Enhancement
        - Integration/Plugin
        - Other
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: Usage Examples
      description: Provide examples of how this feature would be used
      placeholder: |
        ```bash
        codeforge analyze --new-flag
        ```
      render: bash

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: How would this feature benefit CodeForge users?
      placeholder: 'This would help users to...'

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched the existing issues and this is a new feature request
          required: true
        - label: I have read the documentation
          required: false
        - label: This feature would benefit the community
          required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or screenshots about the feature request here
