name: 🐛 Bug Report
description: Report a bug in CodeForge
title: '[Bug]: '
labels: ['bug', 'needs-triage']
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out this form as completely as possible.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is
      placeholder: 'When I run codeforge analyze on my project...'
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Run 'codeforge analyze src/'
        2. With config '...'
        3. See error
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen
      placeholder: 'I expected the analysis to complete successfully...'
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: A clear and concise description of what actually happened
      placeholder: 'Instead, I got this error...'
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots/Logs
      description: If applicable, add screenshots or logs to help explain your problem
      placeholder: 'Paste logs or drag & drop screenshots here...'

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please complete the following information
      value: |
        - CodeForge version: [e.g., 0.1.0]
        - Node.js version: [e.g., 20.10.0]
        - npm version: [e.g., 10.2.3]
        - OS: [e.g., macOS 14.2, Ubuntu 22.04, Windows 11]
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration File
      description: Please share your .codeforgerc.json (remove any sensitive information)
      placeholder: |
        {
          "files": ["src/**/*.ts"],
          "rules": { ... }
        }
      render: json

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched the existing issues and this is a new bug
          required: true
        - label: I have read the [documentation](https://github.com/codeforge-dev/codeforge#readme)
          required: false
        - label: I can provide a minimal reproducible example
          required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here
