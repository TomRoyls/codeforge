name: Cache CodeForge Results

on:
  push:
    branches: [main]
    paths:
      - '.codeforge-cache'

jobs:
  analyze:
    name: Run CodeForge Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Run analysis
        run: npm run build
      - name: CodeForge Analyze
        run: node dist/bin/run.js analyze --format json --output results.json --cache-results
      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: analysis-results
          path: results.json
          retention-days: 5
