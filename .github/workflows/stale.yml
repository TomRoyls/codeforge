name: 'Close stale issues and PRs'
on:
  schedule:
    - cron: '30 1 * * *' # Run daily at 1:30 UTC

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issue configuration
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had recent activity.

            It will be closed in 7 days if no further activity occurs. If this issue is still relevant:
            - Add a comment with any updates
            - Remove the `stale` label
            - Or simply add a 👍 reaction to keep it open

            Thank you for your contributions to CodeForge!
          close-issue-message: |
            This issue has been automatically closed due to inactivity.

            If you believe this issue is still relevant, please:
            - Open a new issue with updated information
            - Reference this issue in the new one

            We appreciate your understanding and contributions!
          stale-issue-label: 'stale'
          days-before-issue-stale: 60
          days-before-issue-close: 7

          # PR configuration
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has not had recent activity.

            It will be closed in 7 days if no further activity occurs. If this PR is still being worked on:
            - Add a comment with status update
            - Remove the `stale` label
            - Push new commits to keep it active

            Thank you for contributing to CodeForge!
          close-pr-message: |
            This pull request has been automatically closed due to inactivity.

            If you'd like to continue this work:
            - Reopen this PR
            - Or open a new PR referencing this one

            We appreciate your contributions!
          stale-pr-label: 'stale'
          days-before-pr-stale: 30
          days-before-pr-close: 7

          # Exempt labels
          exempt-issue-labels: 'pinned,security,enhancement,good first issue,help wanted'
          exempt-pr-labels: 'pinned,security,work in progress'

          # Other settings
          remove-stale-when-updated: true
          delete-branch: false
          enable-statistics: true
          operations-per-run: 100
